name: hyperpassive
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/hyperpassive.mjs
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add hyperpassive-*.json
          git commit -m "하이퍼 패시브 집계" || echo "변경 없음"
          git push
