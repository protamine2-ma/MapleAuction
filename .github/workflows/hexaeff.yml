name: hexaeff
on:
  workflow_dispatch:
    inputs:
      job:
        description: '직업 이름'
        default: '아델'
      class:
        description: '랭킹 직업명'
        default: '레프-아델'
      count:
        description: '연무장 기록 몇 명 평균'
        default: '10'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/hexaeff.mjs
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
          JOB: ${{ inputs.job }}
          CLASS: ${{ inputs.class }}
          COUNT: ${{ inputs.count }}
      - if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add hexaeff-*.json || true
          git commit -m "헥사 효율 집계: ${{ inputs.job }}" || true
          git push || true
