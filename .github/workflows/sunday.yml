name: sunday
on:
  schedule:
    - cron: '0 2 * * 5'
    - cron: '0 8 * * 5'
    - cron: '0 2 * * 6'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install sharp@0.33
      - run: node scripts/sunday.mjs
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sunday.png sunday.json || true
          git diff --cached --quiet || (git commit -m "썬데이 메이플 업데이트" && git push)
